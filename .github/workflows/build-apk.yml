name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure app.json for build
        run: |
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('./app.json', 'utf8'));
            // Ensure build configuration
            appJson.expo.android = appJson.expo.android || {};
            appJson.expo.android.buildType = 'apk';
            fs.writeFileSync('./app.json', JSON.stringify(appJson, null, 2));
          "

      - name: Build Android APK
        run: npx eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK from EAS
        id: download
        run: |
          BUILD_URL=$(npx eas build:list --platform android --non-interactive --json --limit 1 | jq -r '.[0].artifacts.buildUrl')
          if [ -n "$BUILD_URL" ] && [ "$BUILD_URL" != "null" ]; then
            curl -L -o byokos.apk "$BUILD_URL"
            echo "apk_path=byokos.apk" >> $GITHUB_OUTPUT
            echo "APK downloaded successfully"
          else
            echo "Build URL not available yet"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub Releases
        if: steps.download.outputs.apk_path
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "Byok Os v${{ github.run_number }}"
          body: |
            ## Byok Os Android APK
            - Package: `com.byokos.app`
            - Built with: EAS (Expo Application Services)
            - Architecture: Feature-Based Modular Clean Architecture
          files: byokos.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: byokos-apk
          path: byokos.apk
